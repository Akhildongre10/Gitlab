#openapi: 3.1.0
info:
  title: Armory Inventory Management APIs
  description: APIs for managing AIM (Armory Inventory Management)
  version: 1.0.0
tags:
  - name: SuperAdmin
    description: Operations related to managing SuperAdmin.
  - name: Organizations
    description: Operations related to managing organizations.
  - name: Departments
    description: Operations related to managing departments.
  - name: Manufacturer
    description: Operations related to managing Manufacturer.
  - name: Category
    description: Operations related to managing Category.
  - name: Inventory
    description: Operations related to managing inventories.

#security:
#  - BearerAuth: []
paths:
#=======================================Super Admin APIs===========================================================
  /auth/login:
    post:
      summary: Super Admin Login
      operationId: superAdminLogin
      tags:
        - SuperAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuperAdminRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperAdminResponse'
              example:
                token: "jwttoken"
                tokenExpiry: "2023-04-01T12:00:00Z"
                role: "SuperAdmin"
                id: 12345
                email: "john.doe@example.com"
                name: "John Doe"
                phoneNumber: "+1234567890"
                createdAt: "2023-04-01T12:00:00Z"
                updatedAt: "2023-04-01T12:00:00Z"
        '400':
          description: Missing email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperAdminResponse'
              example:
                message: "Email and password are required"
                errorCode: "BAD_REQUEST"

        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperAdminResponse'
              example:
                message: "Invalid email or password"
                errorCode: "UNAUTHORIZED"

        '403':
          description: Account disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperAdminResponse'
              example:
                message: "Account is disabled"
                errorCode: "FORBIDDEN"

        '404':
          description: Super Admin not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperAdminResponse'
              example:
                message: "Super Admin not found"
                errorCode: "NOT_FOUND"


  #=======================================Organization APIs===========================================================
  /organizations:
    get:
      summary: Get all organizations
      operationId: getAllOrganizations
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/X-Tenant-ID'
#        - $ref: '#/components/parameters/Authorization'
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: A list of Organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationDto'
#        '500':
#          description: Internal server error

        '403':
          description: Forbidden - Access Denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Forbidden"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error"


    post:
      summary: Create a new organization
      operationId: createOrganization
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/X-Tenant-ID'
#        - $ref: '#/components/parameters/Authorization'
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationDto'
      responses:
        '201':
          description: Organization created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDto'
        '400':
          description: Bad request - Missing or invalid data
        '403':
          description: Forbidden - Access Denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Forbidden"
        '409':
          description: Organization with same name already present.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error"

  /organizations/{organizationId}:
    get:
      summary: Get organization by organizationId
      operationId: getOrganizationById
      tags:
        - Organizations
      parameters:
        - name: organizationId
          in: path
          required: true
          description: ID of the organization to fetch
          schema:
            type: integer
            format: int64
