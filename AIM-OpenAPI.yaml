#        - $ref: '#/components/parameters/Authorization'
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: Organization details by organizationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDto'
        '403':
          description: Forbidden - Access Denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Forbidden"
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Organization not found"
        '500':
          description: Internal server error

    put:
      summary: Update organization by organization Id
      operationId: updateOrganization
      tags:
        - Organizations
      parameters:
        - name: organizationId
          in: path
          required: true
          description: ID of the organization to update
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/X-Tenant-ID'
#        - $ref: '#/components/parameters/Authorization'
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationDto'
      responses:
        '200':
          description: Organization updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDto'
        '403':
          description: Forbidden - Access Denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Forbidden"
        '404':
          description: Organization data not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Organization not found"
        '400':
          description: Bad request - Missing or invalid data
        '500':
          description: Internal server error

    delete:
      summary: Delete Organization by organizationId
      operationId: deleteOrganization
      tags:
        - Organizations
      parameters:
        - name: organizationId
          in: path
          required: true
          description: ID of the organization to delete
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/X-Tenant-ID'
#        - $ref: '#/components/parameters/Authorization'
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: Organization deleted successfully
        '403':
          description: Forbidden - Access Denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Forbidden"

        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Organization not found"
        '500':
          description: Internal server error

