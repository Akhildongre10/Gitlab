#=====================================================COMPONENTS===========================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    X-Tenant-ID:
      name: X-Tenant-ID
      in: header
      description: Tenant identifier for multi-tenancy.
      required: true
      schema:
        type: string
#    Authorization:
#      name: Authorization
#      in: header
#      description: "Bearer token for authentication. Format: `Bearer <token>`"
#      required: true
#      schema:
#        type: string

  schemas:
#===============================================Super Admin DTOs===================================================================
    SuperAdminRequest:
      type: object
      properties:
        email:
          type: string
          example: "email@example.com"
        password:
          type: string
          example: "password"
      required:
        - email
        - password
    SuperAdminResponse:
      oneOf:
        - $ref: '#/components/schemas/SuperAdminSuccessResponse'
        - $ref: '#/components/schemas/SuperAdminErrorResponse'

    SuperAdminSuccessResponse:
      type: object
      properties:
        token:
          type: string
          example: "***.."
        tokenExpiry:
          type: string
          format: date-time
          description: The timestamp when the SuperAdmin was created.
        role:
          type: string
          example: "role"
        id:
          type: integer
          format: int64
          description: The unique identifier of the SuperAdmin.
        email:
          type: string
          example: "email@example.com"
        name:
          type: string
          example: "John Doe"
        phoneNumber:
          type: string
          example: "+1234567890"
        createdAt:
          type: string
          format: date-time
          description: The timestamp when the SuperAdmin was created.
        updatedAt:
          type: string
          format: date-time
          description: The timestamp when the SuperAdmin was last updated.

    SuperAdminErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Error message here"
      required:
        - error
#===============================================Organization DTOs===================================================================
    OrganizationDto:
      type: object
      properties:
        organizationId:
          type: integer
          format: int64
          description: The unique identifier of the organization.
        organizationName:
          type: string
          description: The unique Name of the organization.
        organizationDetails:
          type: object
          additionalProperties: true  # Allows storing arbitrary JSON data
          description: A JSON object containing details such as organization name, username, email, and phone number
          example:
            email: "admin@weaponvault.com"
            phone_no: "+1234567890"
        createdAt:
          type: string
          format: date-time
          description: The timestamp when the organization was created.
        updatedAt:
          type: string
          format: date-time
          description: The timestamp when the organization was last updated.
        status:
          type: string
          description: The status of the organization (active, inactive, etc.)
#        departments: # One-to-many relationship to departments
#          type: array
#          items:
#            $ref: '#/components/schemas/DepartmentDto'
      required:
        - organizationName
        - organizationDetails

    #Department Schema
    DepartmentDto:
      type: object
      properties:
        departmentId:
          type: integer
          format: int64
          description: The unique identifier of the department.
        departmentName:
          type: string
          description: The name of the department.
        departmentDetails:
          type: object
          additionalProperties: true
          description: A JSON object containing details about the department.
          example:
            department_code: "HR001"
            department_head: "John Doe"
            description: "Handles all human resources tasks."
        createdAt:
          type: string
          format: date-time
          description: The timestamp when the department was created.
        updatedAt:
          type: string
          format: date-time
          description: The timestamp when the department was last updated.
#        organization:  # Many-to-one relationship back to the organization
#          $ref: '#/components/schemas/OrganizationDto'
      required:
        - departmentName
        - departmentDetails


    # Manufacturer Schemas
    ManufacturerDtoInsert:
      type: object
      properties:
        name:
          type: string
          description: Name of the manufacturer

    ManufacturerDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the manufacturer
        name:
          type: string
          description: Name of the manufacturer
        status:
          type: string
          description: Status of the manufacturer (e.g., active, inactive)
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the manufacturer was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the manufacturer was last updated
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryDto'
          description: List of categories associated with the manufacturer.
      required:
        - name

    #Category Schema
    CategoryDto:
      type: object
      properties:
        categoryId:
          type: integer
          format: int64
          description: The unique identifier for the category.
        manufacturers: # Many-to-many relationship with ManufacturerDto
          type: array
          items:
            $ref: '#/components/schemas/ManufacturerDto'
          description: List of manufacturers associated with the category.
        categoryName:
          type: string
          description: The name of the category.
        categoryDetails:
          type: object
          additionalProperties: true
          description: A JSON object containing various details about the category (e.g., model, type, etc.).
          example:
            model: "AR-15"
            type: "Rifle"
            required_training: "Basic"
            required_qualification: "Marksman"
            caliber: "5.56mm"
            length: "36 inches"
            inspection_months: "12"
            maintenance_months: "6"
            description: "A standard assault rifle."

        inventories: # One-to-many association with InventoryDto
          type: array
          items:
            $ref: '#/components/schemas/InventoryDto'
          description: List of inventories associated with the category.
        createdAt:
          type: string
          format: date-time
          description: The timestamp when the category was created.
        updatedAt:
          type: string
          format: date-time
          description: The timestamp when the category was last updated.
      required:
        - categoryName
        - categoryDetails

    CategoryDtoInsert:
      type: object
      properties:
        categoryName:
          type: string
          description: The name of the category.
        categoryDetails:
          type: object
          additionalProperties: true
          description: A JSON object containing various details about the category (e.g., model, type, etc.).
          example:
            model: "AR-15"
            type: "Rifle"
            required_training: "Basic"
            required_qualification: "Marksman"
            caliber: "5.56mm"
            length: "36 inches"
            inspection_months: "12"
            maintenance_months: "6"
            description: "A standard assault rifle."
        manufacturerIds:
          type: array
          items:
            type: integer
            format: int64
          example: [ 1, 2, 3 ]
      required:
        - categoryName
        - categoryDetails
        - manufacturerIds



    #Inventory Dto
    InventoryDto:
      type: object
      properties:
        inventoryId:
          type: integer
          format: int64
          description: The unique identifier for the inventory item.
#        categoryId:
#          type: integer
#          format: int64
#          description: The unique identifier of the associated category.
        category: # Many-to-one association with CategoryDto
          $ref: '#/components/schemas/CategoryDto'
          description: The associated category for the inventory item.
#        assetItemNumber:
#          type: string
#          description: The unique asset item number for the inventory.
        serialNo:
          type: string
          description: The serial number of the inventory item.
        inventoryDetails:
          type: object
          additionalProperties: true
          description: A JSON object containing varisous details about the inventory item (e.g., lot number, rebuild date, etc.).
          example:
            model: "AQW"
            assetItemNumber: "AS123"
            site: "site1"
            nfa_category: "Rifle"
            description: "Brand new rifle, fully assembled and tested."
        createdAt:
          type: string
          format: date-time
          description: The timestamp when the inventory item was created.
        updatedAt:
          type: string
          format: date-time
          description: The timestamp when the inventory item was last updated.
      required:
        - serialNo
        - categoryId


    #Inventory Dto
    InventoryDto_Id:
      type: object
      properties:
        inventoryId:
          type: integer
          format: int64
          description: The unique identifier for the inventory item.
        categoryId:
          type: integer
          format: int64
          description: The unique identifier of the associated category.
#        category: # Many-to-one association with CategoryDto
#          $ref: '#/components/schemas/CategoryDto'
#          description: The associated category for the inventory item.
        #        assetItemNumber:
        #          type: string
        #          description: The unique asset item number for the inventory.
        serialNo:
          type: string
          description: The serial number of the inventory item.
        inventoryDetails:
          type: object
          additionalProperties: true
          description: A JSON object containing varisous details about the inventory item (e.g., lot number, rebuild date, etc.).
          example:
            model: "AQW"
            assetItemNumber: "AS123"
            site: "site1"
            nfa_category: "Rifle"
            description: "Brand new rifle, fully assembled and tested."
        createdAt:
          type: string
          format: date-time
          description: The timestamp when the inventory item was created.
        updatedAt:
          type: string
          format: date-time
          description: The timestamp when the inventory item was last updated.
      required:
        - serialNo
        - categoryId

